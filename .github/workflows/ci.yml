name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOMAIN_APP_COVERAGE_THRESHOLD: 90
  GLOBAL_COVERAGE_THRESHOLD: 80

jobs:
  build-and-test:
    name: Build, format and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build (Release, warnings as errors)
        run: dotnet build --no-restore -c Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Test with coverage
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Generate coverage report
        if: always()
        run: >
          dotnet tool run reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"coverage"
          -reporttypes:"Html;MarkdownSummaryGithub;JsonSummary"
          -assemblyfilters:"+ReveilMusical.*;-ReveilMusical.*Tests"
          -filefilters:"+*;-*OpenApiXmlCommentSupport*"

      - name: Publish coverage summary
        if: always()
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No coverage summary generated yet." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage thresholds
        if: always()
        run: ./scripts/check-coverage.sh coverage/Summary.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (vulnerabilities, freshness, licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore (NuGetAudit fails the build on known vulnerabilities)
        run: dotnet restore --locked-mode

      - name: List vulnerable packages (informative detail)
        if: always()
        run: |
          {
            echo "### Vulnerable packages"
            echo '```'
            dotnet list package --vulnerable --include-transitive || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List outdated packages (informative, non-blocking)
        if: always()
        run: |
          {
            echo "### Outdated packages"
            echo '```'
            dotnet list package --outdated --include-transitive || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check licenses against the allow-list (blocking)
        run: >
          dotnet tool run dotnet-project-licenses --allow-roll-forward --
          --input .
          --allowed-license-types licenses-allowed.json
          --include-transitive
          --use-project-assets-json
          --manual-package-information license-exceptions.json
          --json --outfile licenses-report.json

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: license-report
          path: licenses-report.json
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  sbom:
    name: Publish SBOM
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Generate CycloneDX SBOM
        run: >
          dotnet tool run dotnet-CycloneDX --allow-roll-forward --
          ReveilMusical.slnx
          -o docs/sbom
          -fn sbom.json
          -F Json
          --set-name ReveilMusical
          --set-version ${{ github.sha }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: docs/sbom/sbom.json
